<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="New Era Begins. A special iFruit Event in Los Santos. November 7, 2026, 22:00 CET." />
    <title>New Era Begins.</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { margin: 0; background: #000; color: #f5f5f7; }
      body {
        min-height: 100vh;
        font-family: "SF Pro Display", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main { display: grid; justify-items: center; }
      .poster {
        width: min(640px, 100%);
        height: auto;
        display: block;
      }
      .when {
        width: min(640px, calc(100% - 40px));
        text-align: center;
        padding: 8px 0 72px;
      }
      .kicker {
        margin: 0 0 14px;
        font: 600 12px "IBM Plex Mono", ui-monospace, Consolas, monospace;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: rgba(245, 245, 247, 0.62);
      }
      h1 {
        margin: 0;
        font-size: clamp(34px, 6vw, 64px);
        font-weight: 560;
        letter-spacing: -0.035em;
        line-height: 1;
      }
      .time {
        margin: 14px 0 0;
        font: 500 15px "IBM Plex Mono", ui-monospace, Consolas, monospace;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: rgba(245, 245, 247, 0.82);
      }
      .line {
        height: 1px;
        width: min(280px, 60%);
        margin: 28px auto;
        background: linear-gradient(90deg, transparent, rgba(160, 198, 255, 0.95), transparent);
        box-shadow: 0 0 22px rgba(130, 175, 255, 0.45);
      }
      .count {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 10px;
      }
      .count div {
        padding: 16px 6px 12px;
        border-radius: 16px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: radial-gradient(120% 80% at 50% 0%, rgba(140, 180, 255, 0.16), transparent 55%), #07080c;
      }
      .count b {
        display: block;
        font-size: clamp(26px, 4vw, 40px);
        font-weight: 560;
        letter-spacing: -0.04em;
        font-variant-numeric: tabular-nums;
      }
      .count span {
        display: block;
        margin-top: 6px;
        font: 500 10px "IBM Plex Mono", ui-monospace, Consolas, monospace;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: rgba(245, 245, 247, 0.48);
      }
      .live {
        margin: 0;
        font-size: 22px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }
      .note {
        margin: 22px 0 0;
        color: rgba(245, 245, 247, 0.62);
        font-size: 15px;
        line-height: 1.5;
      }
      .sound {
        margin: 26px auto 0;
        display: inline-flex;
        align-items: center;
        gap: 10px;
        height: 38px;
        padding: 0 16px 0 12px;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        background: rgba(255, 255, 255, 0.03);
        color: rgba(245, 245, 247, 0.9);
        font-size: 12px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }
      .sound:hover { background: rgba(255, 255, 255, 0.08); }
      .sound.on { border-color: rgba(180, 206, 240, 0.7); box-shadow: 0 0 22px rgba(130, 175, 255, 0.25); }
      .glyph { width: 10px; height: 12px; display: block; }
      .sound .glyph { border-style: solid; border-width: 6px 0 6px 9px; border-color: transparent transparent transparent #f5f5f7; }
      .sound.on .glyph { border: 0; background: linear-gradient(#f5f5f7, #f5f5f7) 0 0 / 3px 12px no-repeat, linear-gradient(#f5f5f7, #f5f5f7) 7px 0 / 3px 12px no-repeat; }
    </style>
  </head>
  <body>
    <main>
      <img class="poster" src="new-era.png" alt="New Era Begins. Join us for a special iFruit Event in Los Santos. November 7, 2026. 22:00 CET." />
      <section class="when" aria-label="When">
        <p class="kicker">Los Santos</p>
        <h1>November 7, 2026</h1>
        <p class="time">22:00 CET</p>
        <div class="line"></div>
        <div id="count" class="count" aria-live="polite"></div>
        <p class="note">A special iFruit Event.</p>
        <button id="sound" class="sound" type="button" aria-pressed="false">
          <span class="glyph" aria-hidden="true"></span>
          <span id="sound-label">Play</span>
        </button>
      </section>
    </main>
    <script>
      var target = Date.parse("2026-11-07T21:00:00.000Z");
      var box = document.getElementById("count");
      function pad(n) { return String(n).padStart(2, "0"); }
      function cell(value, label) {
        return "<div><b>" + value + "</b><span>" + label + "</span></div>";
      }
      function tick() {
        var left = target - Date.now();
        if (left <= 0) {
          box.className = "";
          box.innerHTML = "<p class=\"live\">The event is live.</p>";
          return;
        }
        var s = Math.floor(left / 1000);
        box.innerHTML =
          cell(Math.floor(s / 86400), "Days") +
          cell(pad(Math.floor((s % 86400) / 3600)), "Hours") +
          cell(pad(Math.floor((s % 3600) / 60)), "Minutes") +
          cell(pad(s % 60), "Seconds");
      }
      tick();
      setInterval(tick, 1000);

      var audio = { ctx: null, master: null, timer: null, nextAt: 0, step: 0, on: false };
      var chords = [
        [45, 52, 57, 60, 64],
        [41, 48, 53, 57, 60],
        [48, 52, 55, 59, 64],
        [43, 50, 55, 59, 62]
      ];
      function midi(n) { return 440 * Math.pow(2, (n - 69) / 12); }
      function hall(ctx) {
        var rate = ctx.sampleRate;
        var len = Math.floor(rate * 2.8);
        var buffer = ctx.createBuffer(2, len, rate);
        for (var c = 0; c < 2; c++) {
          var data = buffer.getChannelData(c);
          for (var i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.4);
        }
        var verb = ctx.createConvolver();
        verb.buffer = buffer;
        return verb;
      }
      function voice(freq, type, when, dur, peak) {
        var osc = audio.ctx.createOscillator();
        var gain = audio.ctx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.0001, when);
        gain.gain.exponentialRampToValueAtTime(peak, when + Math.min(2.2, dur * 0.28));
        gain.gain.exponentialRampToValueAtTime(0.0001, when + dur);
        osc.connect(gain);
        gain.connect(audio.bus);
        osc.start(when);
        osc.stop(when + dur + 0.05);
      }
      function playChord(notes, when) {
        voice(midi(notes[0] - 12), "sine", when, 12, 0.07);
        voice(midi(notes[0] - 12) * 1.004, "sine", when, 12, 0.04);
        for (var i = 0; i < notes.length; i++) voice(midi(notes[i]), "triangle", when, 12, 0.028 - i * 0.002);
        voice(midi(notes[notes.length - 1] + 12), "sine", when + 1.4, 3.2, 0.035);
        voice(midi(notes[2] + 12), "sine", when + 4.6, 2.6, 0.022);
      }
      function schedule() {
        var horizon = audio.ctx.currentTime + 1.4;
        while (audio.nextAt < horizon) {
          playChord(chords[audio.step % chords.length], audio.nextAt);
          audio.nextAt += 8;
          audio.step++;
        }
      }
      function ensure() {
        if (audio.ctx) return;
        var Ctx = window.AudioContext || window.webkitAudioContext;
        var ctx = new Ctx();
        var bus = ctx.createGain();
        var dry = ctx.createGain();
        var wet = ctx.createGain();
        var comp = ctx.createDynamicsCompressor();
        var master = ctx.createGain();
        var verb = hall(ctx);
        bus.gain.value = 1;
        dry.gain.value = 0.72;
        wet.gain.value = 0.38;
        comp.threshold.value = -16;
        comp.knee.value = 18;
        comp.ratio.value = 2.4;
        master.gain.value = 0.0001;
        bus.connect(dry);
        dry.connect(comp);
        bus.connect(verb);
        verb.connect(wet);
        wet.connect(comp);
        comp.connect(master);
        master.connect(ctx.destination);
        audio.ctx = ctx;
        audio.bus = bus;
        audio.master = master;
        audio.verb = verb;
      }
      function setSound(on) {
        var button = document.getElementById("sound");
        button.classList.toggle("on", on);
        button.setAttribute("aria-pressed", on ? "true" : "false");
        document.getElementById("sound-label").textContent = on ? "Pause" : "Play";
      }
      document.getElementById("sound").addEventListener("click", function () {
        ensure();
        var ctx = audio.ctx;
        var gain = audio.master.gain;
        var now = ctx.currentTime;
        gain.cancelScheduledValues(now);
        if (audio.on) {
          gain.setValueAtTime(gain.value, now);
          gain.linearRampToValueAtTime(0.0001, now + 0.45);
          clearInterval(audio.timer);
          audio.timer = null;
          audio.on = false;
          setSound(false);
          setTimeout(function () { if (!audio.on) ctx.suspend(); }, 500);
          return;
        }
        ctx.resume();
        gain.setValueAtTime(Math.max(gain.value, 0.0001), now);
        gain.exponentialRampToValueAtTime(0.9, now + 1.3);
        audio.nextAt = now + 0.08;
        schedule();
        audio.timer = setInterval(schedule, 500);
        audio.on = true;
        setSound(true);
      });
    </script>
  </body>
</html>
